name: Cross-Language Semantic Retrieval Audit for Zava Voice of Customer Application
description: Cross-Language Semantic Retrieval Audit for Zava Voice of Customer Application
title: "Mission: "
labels:
  - promptathon-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Promptathon work. 
  - type: textarea
    id: mission-open-goal
    attributes:
      label: Mission/open goal Description
      description: What mission did you choose, or what open-ended goal did you set for the agent?
      placeholder: Evaluate whether Zava's semantic retrieval can reliably identify cross-language customer feedback themes across reviews and support conversations, and measure quality using hand-labeled Precision@5.
    validations:
      required: true
  - type: input
    id: harness-and-model
    attributes:
      label: Harness and model
      description: Which harness did you use, and which model powered it?
      placeholder: "GitHub Copilot coding agent in VS Code with GPT-5.3-Codex."
    validations:
      required: true
  - type: textarea
    id: turn-by-turn-journey
    attributes:
      label: Turn-by-turn journey
      description: Summarize the important prompts, agent actions, SQL interactions, decisions, and iterations.
      placeholder: | 1. Prompt:
   "Create an artifact voc_semantic_retrieval_audit.ipynb ... evaluate cross-language themes and hand-labeled Precision@5."
   Agent response or action:
   Created notebook with retrieval flow, label template, Precision@5 evaluation, and error analysis.
   Result:
   Initial audit artifact delivered.

2. Prompt:
   "run the notebook artifact"
   Agent response or action:
   Attempted run; hit kernel selection friction.
   Result:
   Continued with deterministic file-based completion where needed.

3. Prompt:
   "It says no completed label file found yet ... can this be done"
   Agent response or action:
   Generated `precision_at_5_labels.csv` baseline from template + retrieval output.
   Result:
   Unblocked evaluation flow.

4. Prompt:
   "can you add the above working script into the artifact"
   Agent response or action:
   Added optional auto-fill baseline section in notebook.
   Result:
   Improved reproducibility and annotation speed.

5. Prompt:
   "at the end can you add ... model-card style note ... overclaimed and reined it in"
   Agent response or action:
   Added model-card style section with strengths, limitations, and overclaim control.
   Result:
   Better risk framing and reporting quality.

6. Prompt:
   "did it use sql mcp in the artifact" and "incorporate find_similar_docs_by_doc_id and one sql mcp tool"
   Agent response or action:
   Added MCP evidence and metrics.
   - `mcp_sql_mcp_serve_find_similar_docs_by_doc_id` calls:
     - `DocId=1, TopN=5` -> `[1, 24, 11, 15, 9]`
     - `DocId=2, TopN=5` -> `[2, 7, 18, 21, 3]`
     - `DocId=3, TopN=5` -> `[3, 7, 2, 21, 6]`
   - `mcp_sql_mcp_serve_execute_entity` with `entity=FindSimilarDocsByDocId, DocId=2, TopN=5` -> `[2, 7, 18, 21, 3]`
   - `mcp_sql_mcp_serve_describe_entities` returned entities including `Doc` and `FindSimilarDocsByDocId`
   - Noted correction: `mcp_sql_mcp_serve_read_records` returned `EntityNotFound`; switched to execute + vector retrieval path.
   Result:
   Added consistency checks and evidence-backed SQL MCP usage.

7. Prompt:
   "can you provide ... prompt.md, tools.md, journey.md, architecture.png, improvements.md"
   Agent response or action:
   Generated full documentation package and architecture diagram.
   Result:
   Submission package completed.

8. Prompt:
   "place those files in the github repo in capgemhon"
   Agent response or action:
   Force-added ignored artifact paths, committed, and pushed to `origin/main`.
   Result:
   Artifacts published to repository.

    validations:
      required: true
  - type: checkboxes
    id: completion
    attributes:
      label: Completion
      description: Did the agent complete the mission or open-ended goal?
      options:
        - label: Yes, the agent completed the mission or goal.
        - label: No, the agent did not complete the mission or goal.
  - type: textarea
    id: bonus-work
    attributes:
      label: Bonus work
      description: Did you go over and beyond? Share any extra work, optimizations, or enhancements you implemented.
      placeholder: Describe any bonus features, improvements, or additional work you completed beyond the core mission.
    validations:
      required: false
