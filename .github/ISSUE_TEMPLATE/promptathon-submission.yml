name: Cross-Language Semantic Retrieval Audit for Zava Voice of Customer Application
description: Cross-Language Semantic Retrieval Audit for Zava Voice of Customer Application
title: "Mission: "
labels:
  - promptathon-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Promptathon work. 
  - type: textarea
    id: mission-open-goal
    attributes:
      label: Mission/open goal Description
      description: What mission did you choose, or what open-ended goal did you set for the agent?
      placeholder: Evaluate whether Zava's semantic retrieval can reliably identify cross-language customer feedback themes across reviews and support conversations, and measure quality using hand-labeled Precision@5.
    validations:
      required: true
  - type: input
    id: harness-and-model
    attributes:
      label: Harness and model
      description: Which harness did you use, and which model powered it?
      placeholder: "GitHub Copilot coding agent in VS Code with GPT-5.3-Codex."
    validations:
      required: true
  - type: textarea
    id: turn-by-turn-journey
    attributes:
      label: Turn-by-turn journey
      description: Summarize the important prompts, agent actions, SQL interactions, decisions, and iterations.
      placeholder: I created a voc_semantic_retrieval_audit.ipynb artifact to evaluate cross language themes with hand labeled Precision@5 then attempted to run it and handled kernel friction by using deterministic file based completion, generated precision_at_5_labels.csv to unblock missing labels, added the working script into the notebook with an optional auto fill baseline, appended a model card style section to rein in overclaiming, incorporated SQL MCP evidence using mcp_sql_mcp_serve_find_similar_docs_by_doc_id, mcp_sql_mcp_serve_execute_entity, and mcp_sql_mcp_serve_describe_entities while correcting an EntityNotFound path from mcp_sql_mcp_serve_read_records, produced prompt.md, tools.md, journey.md, architecture.png, and improvements.md, and finally force added ignored artifact paths before committing and pushing everything to origin/main.
    validations:
      required: true
  - type: checkboxes
    id: completion
    attributes:
      label: Completion
      description: Did the agent complete the mission or open-ended goal?
      options:
        - label: Yes, the agent completed the mission or goal.
  - type: textarea
    id: bonus-work
    attributes:
      label: Bonus work
      description: Did you go over and beyond? Share any extra work, optimizations, or enhancements you implemented.
      placeholder: Added optional baseline auto-label workflow to accelerate annotation. Added MCP cross-tool consistency calculations. Added model-card style risk framing and overclaim mitigation language. Added architecture diagram and improvement roadmap. Included measurable validation mean non-self distance@5 = `0.2987`, Jaccard@5 (DocId 2) = `1.0`, exact order match = `True`.
    validations:
      required: false
